[package]
name    = "nanoshot"
version = "0.9.0"
edition = "2024"

[[bin]]
name = "nanoshot"
path = "nanoshot.rs"

[dependencies]
tray-icon = "*"
image = "0.25"
winit = "0.30"

[profile.release]
strip         = true
opt-level     = 3
lto           = true
codegen-units = 1
debug         = false
panic         = 'unwind'