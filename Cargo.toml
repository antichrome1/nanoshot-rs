[package]
name    = "nanoshot"
version = "0.9.5"
edition = "2024"
homepage    = "https://github.com/antichrome1/nanoshot-rs"
description = "Simple screenshotting tool for MacOS"
authors     = ["Aditya Singh <antichrome1@proton.me>"]
license     = "ISC"
readme      = "README.md"

[[bin]]
name = "nanoshot"
path = "nanoshot.rs"

[dependencies]
tray-icon = "*"
image = "0.25"
winit = "0.30"

[profile.release]
strip         = true
opt-level     = 3
lto           = true
codegen-units = 1
debug         = false
panic         = 'unwind'